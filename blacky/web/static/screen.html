<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blacky Companion</title>
  <style>
    :root {
      --bg: #090e0c;
      --card-bg: rgba(16, 26, 22, 0.88);
      --border: rgba(0, 255, 163, 0.2);
      --border-hover: rgba(0, 255, 163, 0.5);
      --green: #00ffa3;
      --green-glow: rgba(0, 255, 163, 0.25);
      --cyan: #00e5ff;
      --dim: #79978d;
      --text: #e6fcf3;
      --user-bg: #102d23;
      --red: #ff5c5c;
      --amber: #ffbe3b;
      --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "SF Mono", Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      user-select: text;
    }

    body {
      display: flex;
      flex-direction: column;
      position: relative;
      background: radial-gradient(circle at 10% 0%, #0d261e 0%, var(--bg) 60%);
      border: 1px solid var(--border);
    }

    /* Draggable Header for moving window anywhere */
    header {
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(7, 12, 10, 0.95);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.9); }
    }

    .title {
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge {
      font-size: 0.62rem;
      font-family: var(--font-mono);
      color: var(--green);
      background: rgba(0, 255, 163, 0.1);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 5px;
      letter-spacing: 0.5px;
    }

    .header-actions {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      -webkit-app-region: no-drag;
      background: transparent;
      border: 1px solid transparent;
      color: var(--dim);
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .icon-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border);
    }

    .close-btn:hover {
      color: var(--red);
      background: rgba(255, 92, 92, 0.15);
      border-color: rgba(255, 92, 92, 0.3);
    }

    /* Main Chat Stream Area */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-thumb { background: rgba(0, 255, 163, 0.15); border-radius: 2px; }

    .msg {
      max-width: 90%;
      font-size: 0.83rem;
      line-height: 1.55;
      word-break: break-word;
      animation: fadeIn 0.15s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user-bg);
      border: 1px solid rgba(0, 255, 163, 0.35);
      border-radius: 14px 14px 2px 14px;
      padding: 9px 13px;
      color: #e3fff5;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .msg.agent {
      align-self: flex-start;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px 14px 14px 2px;
      padding: 10px 13px;
      color: var(--text);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }

    .msg.system {
      align-self: center;
      max-width: 96%;
      background: rgba(0, 255, 163, 0.04);
      border: 1px dashed rgba(0, 255, 163, 0.25);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.76rem;
      color: var(--dim);
      line-height: 1.55;
      text-align: center;
    }

    .msg.system b { color: var(--green); }

    .tool-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.68rem;
      font-family: var(--font-mono);
      background: rgba(0, 255, 163, 0.08);
      border: 1px solid rgba(0, 255, 163, 0.2);
      border-radius: 4px;
      padding: 2px 6px;
      margin: 3px 0 6px 0;
      color: var(--green);
    }

    .msg code {
      font-family: var(--font-mono);
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 0.78rem;
      color: #8affd3;
    }

    .msg pre {
      background: #060b09;
      border: 1px solid rgba(0, 255, 163, 0.18);
      border-radius: 6px;
      padding: 8px 10px;
      margin: 6px 0;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: #a4fbdc;
    }

    /* Solved Cards / Structured Result */
    .mcq-card {
      background: rgba(14, 25, 20, 0.95);
      border: 1px solid rgba(0, 255, 163, 0.35);
      border-radius: 8px;
      padding: 10px 12px;
      margin: 4px 0;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
    }

    .mcq-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--green);
    }

    .mcq-badge {
      background: rgba(0, 255, 163, 0.12);
      border: 1px solid var(--green);
      border-radius: 3px;
      padding: 2px 6px;
    }

    .mcq-q {
      font-size: 0.8rem;
      color: #ffffff;
      font-weight: 500;
      margin-bottom: 8px;
      line-height: 1.45;
    }

    .mcq-opts {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 8px;
    }

    .mcq-opt {
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 0.74rem;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #ccdcd5;
    }

    .mcq-opt.correct {
      background: rgba(0, 255, 163, 0.15);
      border-color: var(--green);
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 0 10px rgba(0, 255, 163, 0.15);
    }

    .mcq-why {
      font-size: 0.71rem;
      color: var(--dim);
      border-top: 1px dashed rgba(0, 255, 163, 0.15);
      padding-top: 6px;
      line-height: 1.4;
    }

    .mcq-why b { color: var(--green); }

    /* Live Status Bar */
    .activity-bar {
      padding: 5px 14px;
      font-size: 0.68rem;
      font-family: var(--font-mono);
      color: var(--dim);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(7, 12, 10, 0.8);
      border-top: 1px solid rgba(0, 255, 163, 0.08);
    }

    .activity-bar.busy {
      color: var(--green);
    }

    /* Footer & Input Bar */
    footer {
      padding: 10px 12px;
      background: rgba(7, 11, 9, 0.98);
      border-top: 1px solid var(--border);
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #091310;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      transition: all 0.15s ease-in-out;
    }

    .input-row:focus-within {
      border-color: var(--green);
      box-shadow: 0 0 12px var(--green-glow);
    }

    #input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 0.83rem;
    }

    #input::placeholder { color: var(--dim); font-size: 0.78rem; }

    .send-btn {
      background: var(--green);
      color: #06110d;
      border: none;
      border-radius: 6px;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      transition: all 0.15s;
    }

    .send-btn:hover {
      background: #47ffb8;
      box-shadow: 0 0 10px var(--green);
    }

    .send-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- Draggable Window Header -->
  <header>
    <div class="brand">
      <div class="dot" id="dotStatus"></div>
      <div class="title">
        BLACKY
        <span class="badge" id="modelBadge">qwen3.5:4b</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="clearBtn" title="Clear Chat">🗑</button>
      <button class="icon-btn close-btn" id="closeBtn" title="Hide to Menu Bar">✕</button>
    </div>
  </header>

  <!-- Chat Messages Stream -->
  <main id="chat">
    <div class="msg system">
      <b>🐾 Blacky Assistant Ready.</b><br>
      Floating companion active. Ask me anything or tell me to do any task on your Mac.
    </div>
  </main>

  <!-- Live Status Bar -->
  <div class="activity-bar" id="activity">
    <span id="activityText">Ready</span>
    <span id="modelLabel">qwen3.5:4b</span>
  </div>

  <!-- Bottom Input Bar -->
  <footer>
    <div class="input-row">
      <input type="text" id="input" placeholder="Ask anything or tell Blacky what to do..." autocomplete="off" autofocus>
      <button class="send-btn" id="sendBtn" title="Send (Enter)">➤</button>
    </div>
  </footer>

  <script>
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearBtn');
    const closeBtn = document.getElementById('closeBtn');
    const activityText = document.getElementById('activityText');
    const activity = document.getElementById('activity');
    const modelLabel = document.getElementById('modelLabel');
    const modelBadge = document.getElementById('modelBadge');
    const dotStatus = document.getElementById('dotStatus');

    let busy = false;

    // Helper: Escape HTML
    function esc(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    // Helper: Markdown parser for code and highlights
    function renderMarkdown(text) {
      let html = esc(text);
      // Code blocks
      html = html.replace(/```([\s\S]*?)```/g, (m, code) => `<pre><code>${code.trim()}</code></pre>`);
      // Inline code
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      // Bold
      html = html.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
      // Bullet items
      html = html.replace(/^\s*[-•]\s*(.+)$/gm, '• $1');
      return html.replace(/\n/g, '<br>');
    }

    // Append Chat Bubble
    function appendMsg(role, content, tools = []) {
      const el = document.createElement('div');
      el.className = `msg ${role}`;
      
      let toolsHtml = '';
      if (tools && tools.length > 0) {
        toolsHtml = tools.map(t => `<div class="tool-tag">⚡ ${esc(t.tool || t.name || 'Action')}</div>`).join('');
      }

      el.innerHTML = toolsHtml + renderMarkdown(content);
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    // Append MCQ Card (fallback if user specifically asks to solve MCQs)
    function appendMcqCard(record) {
      const el = document.createElement('div');
      el.className = 'msg agent mcq-card';
      const optionsHtml = (record.options || []).map((opt, i) => {
        const letter = String.fromCharCode(65 + i);
        const isCorrect = i === record.answer_index;
        return `
          <div class="mcq-opt ${isCorrect ? 'correct' : ''}">
            <b>${letter}.</b>
            <span>${esc(opt)}</span>
            ${isCorrect ? '<span style="margin-left:auto;">✅</span>' : ''}
          </div>
        `;
      }).join('');

      el.innerHTML = `
        <div class="mcq-head">
          <span class="mcq-badge">Question ${record.number}</span>
          <span>${record.advanced ? 'Advancing ➔' : 'Solved'}</span>
        </div>
        <div class="mcq-q">${esc(record.question)}</div>
        <div class="mcq-opts">${optionsHtml}</div>
        ${record.explanation ? `<div class="mcq-why"><b>Why:</b> ${esc(record.explanation)}</div>` : ''}
      `;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }

    function setBusy(val, msg) {
      busy = val;
      sendBtn.disabled = val;
      activity.classList.toggle('busy', val);
      activityText.textContent = msg || (val ? 'Executing task...' : 'Ready');
    }

    async function api(path, options = {}) {
      try {
        const res = await fetch(path, options);
        return await res.json();
      } catch (e) {
        return { response: '⚠️ Server connection error', error: e.message };
      }
    }

    // Send chat command
    async function submitPrompt(text) {
      const q = (text || input.value || '').trim();
      if (!q || busy) return;
      input.value = '';

      appendMsg('user', q);
      setBusy(true, 'Executing task...');

      const data = await api('/api/screen/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: q })
      });

      setBusy(false, 'Ready');

      if (data.solved && data.solved.length > 0) {
        data.solved.forEach(appendMcqCard);
      } else if (data.response) {
        appendMsg('agent', data.response, data.tools || []);
      }
      input.focus();
    }

    // Hide companion window into Menu Bar
    function hideCompanionWindow() {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.blacky) {
        window.webkit.messageHandlers.blacky.postMessage('hide');
      } else {
        fetch('/api/screen/window/hide', { method: 'POST' }).catch(() => {});
      }
    }

    // Check status
    async function refreshStatus() {
      try {
        const s = await api('/api/screen/status');
        if (s.agent_ready || s.ready) {
          dotStatus.style.background = '#00ffa3';
          dotStatus.style.boxShadow = '0 0 8px #00ffa3';
          const modelName = s.vision_model || s.model || 'qwen3.5:4b';
          modelBadge.textContent = modelName;
          modelLabel.textContent = modelName;
        } else {
          dotStatus.style.background = '#ffbe3b';
          dotStatus.style.boxShadow = '0 0 8px #ffbe3b';
          modelBadge.textContent = 'CONNECTING';
          modelLabel.textContent = s.detail || 'Ollama starting...';
        }
      } catch (e) {
        dotStatus.style.background = '#ff5c5c';
        modelBadge.textContent = 'OFFLINE';
      }
    }

    // Event Listeners
    sendBtn.addEventListener('click', () => submitPrompt());
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitPrompt();
      }
    });

    clearBtn.addEventListener('click', () => {
      chat.innerHTML = `
        <div class="msg system">
          <b>🐾 Chat Reset.</b> Blacky Assistant ready.<br>
          Ask me anything or tell me to do any task on your Mac.
        </div>
      `;
      input.focus();
    });

    closeBtn.addEventListener('click', hideCompanionWindow);

    // Expose global bridge for native Menu Bar interactions
    window.BlackyCompanion = {
      submit: (text) => submitPrompt(text),
      analyze: () => submitPrompt('Analyze my screen and tell me what is open and visible')
    };

    // Initial setup
    refreshStatus();
    setInterval(refreshStatus, 8000);
    input.focus();
  </script>
</body>
</html>
