<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BlackyAgent Mobile Remote</title>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(22, 27, 34, 0.7);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent: #8a2be2;
      --accent-glow: #00d2ff;
      --text: #f0f6fc;
      --text-dim: #8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 10%, #1a103c 0%, var(--bg) 80%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      background: rgba(9, 10, 15, 0.6);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .orb-mini {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(45deg, var(--accent), var(--accent-glow));
      box-shadow: 0 0 15px var(--accent-glow);
      animation: pulse 2.5s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 22px #a855f7; }
    }
    .brand h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.5px; }
    .badge {
      font-size: 0.75rem;
      background: rgba(0, 210, 255, 0.15);
      color: var(--accent-glow);
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid rgba(0, 210, 255, 0.3);
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .message {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: 18px;
      line-height: 1.45;
      font-size: 0.95rem;
      word-break: break-word;
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.agent {
      align-self: flex-start;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-bottom-left-radius: 4px;
    }
    .message pre {
      background: #0d1117;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
      margin-top: 8px;
      font-size: 0.85rem;
      border: 1px solid #30363d;
    }
    .message code { font-family: monospace; }
    .chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 16px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 6px 12px;
      font-size: 0.8rem;
      white-space: nowrap;
      cursor: pointer;
      color: #c9d1d9;
    }
    .chip:active { background: var(--accent); color: white; }
    footer {
      padding: 12px 16px 24px;
      background: rgba(9, 10, 15, 0.85);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .input-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 4px 14px;
    }
    input[type="text"] {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: white;
      font-size: 0.95rem;
      padding: 8px 4px;
    }
    button.send-btn {
      background: transparent;
      border: none;
      color: var(--accent-glow);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
    }
    .mic-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #a855f7, #06b6d4);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .mic-btn.listening {
      background: #ef4444;
      animation: pulse-mic 1s infinite alternate;
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.8);
    }
    @keyframes pulse-mic {
      0% { transform: scale(1); }
      100% { transform: scale(1.18); }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="orb-mini"></div>
      <div>
        <h1>BlackyAgent</h1>
        <div style="font-size: 0.7rem; color: var(--text-dim);">Mac & Mobile Controller</div>
      </div>
    </div>
    <span class="badge" id="voice-toggle" onclick="toggleVoiceOutput()" style="color: var(--text-dim);">🔇 Voice: OFF</span>
  </header>

  <div id="chat-container">
    <div class="message agent">
      👋 Hi! I am <strong>Blacky</strong>. You are connected via Mobile Remote!<br><br>
      Tap the <strong>microphone</strong> or type below to command me (e.g. create folders, write code, search web, control macOS).
    </div>
  </div>

  <div class="chips">
    <div class="chip" onclick="sendQuick('Create a folder named binary_search and write binary search in python')">📁 Make Binary Search</div>
    <div class="chip" onclick="sendQuick('What is my mac battery and system status?')">🔋 System Status</div>
    <div class="chip" onclick="sendQuick('Search the web for latest tech news')">🌐 Tech News</div>
    <div class="chip" onclick="sendQuick('Open Spotify application on my Mac')">🎵 Open Spotify</div>
  </div>

  <footer>
    <button class="mic-btn" id="mic-button" onclick="toggleVoiceInput()" title="Push-to-Talk">🎙️</button>
    <div class="input-wrapper">
      <input type="text" id="prompt-input" placeholder="Ask Blacky anything..." onkeydown="if(event.key==='Enter') submitPrompt()">
      <button class="send-btn" onclick="submitPrompt()">➔</button>
    </div>
  </footer>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const promptInput = document.getElementById('prompt-input');
    const micButton = document.getElementById('mic-button');
    let voiceOutputEnabled = false;
    let recognition = null;
    let isListening = false;

    // Initialize Web Speech API for mobile dictation
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isListening = true;
        micButton.classList.add('listening');
      };

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        promptInput.value = transcript;
        submitPrompt();
      };

      recognition.onerror = (e) => {
        console.warn('Speech error:', e);
        stopListening();
      };

      recognition.onend = () => {
        stopListening();
      };
    }

    function toggleVoiceInput() {
      if (!recognition) {
        alert("Speech Recognition not supported in this browser. Please use Chrome or Safari!");
        return;
      }
      if (isListening) {
        recognition.stop();
      } else {
        try {
          recognition.start();
        } catch (e) {
          console.error(e);
        }
      }
    }

    function stopListening() {
      isListening = false;
      micButton.classList.remove('listening');
    }

    function toggleVoiceOutput() {
      voiceOutputEnabled = !voiceOutputEnabled;
      const el = document.getElementById('voice-toggle');
      el.textContent = voiceOutputEnabled ? "🔊 Voice: ON" : "🔇 Voice: OFF";
      el.style.color = voiceOutputEnabled ? "var(--accent-glow)" : "var(--text-dim)";
    }

    function speakOnMobile(text) {
      if (!voiceOutputEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      // Remove markdown for clean mobile speech
      const clean = text.replace(/```[\s\S]*?```/g, ' Code generated. ')
                        .replace(/[*#`_~>]/g, '')
                        .replace(/https?:\/\/\S+/g, '');
      const utterance = new SpeechSynthesisUtterance(clean);
      utterance.rate = 1.05;
      window.speechSynthesis.speak(utterance);
    }

    function appendMessage(text, role) {
      const msg = document.createElement('div');
      msg.className = `message ${role}`;
      // Basic markdown parser
      let formatted = text
        .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>')
        .replace(/\n/g, '<br>');
      msg.innerHTML = formatted;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msg;
    }

    async function submitPrompt() {
      const text = promptInput.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      promptInput.value = '';

      const loadingMsg = appendMessage('⏳ Thinking and executing...', 'agent');

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });
        const data = await res.json();
        loadingMsg.remove();
        appendMessage(data.response, 'agent');
        speakOnMobile(data.response);
      } catch (err) {
        loadingMsg.remove();
        appendMessage('⚠️ Error connecting to BlackyAgent on Mac: ' + err.message, 'agent');
      }
    }

    function sendQuick(cmd) {
      promptInput.value = cmd;
      submitPrompt();
    }
  </script>
</body>
</html>
